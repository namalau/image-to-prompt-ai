
name: Build Image to Prompt AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImageToPromptAI-AndroidStudio.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

    
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      
      
      
      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q ImageToPromptAI-AndroidStudio.zip -d extracted
          echo "ISI FOLDER HASIL EKSTRAK:"
          ls -la extracted
          echo "LOKASI GRADLE WRAPPER:"
          find extracted -maxdepth 5 -name gradlew -print

    

     
      - name: Build APK
        run: |
          cd extracted
          GRADLEW=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assemextracted
      
    
    
