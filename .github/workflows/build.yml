
name: Build Image to Prompt AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImageToPromptAI-AndroidStudio.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

    
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extract project
        run:    mk      mkdir extracted
          unzip -q ImageToPromptAI-AndroidStudio.zip -d extracted

      - name: Build APK
        working-directory: extracted/ImageToPromptAI
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToPromptAI-APK
          path: extracted/ImageToPromptAI/app/build/outputs/apk/debug/app-debug.apk
